services:
  db:
    image: postgres:16.10-alpine@sha256:029660641a0cfc575b14f336ba448fb8a75fd595d42e1fa316b9fb4378742297
    container_name: mts-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mts_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - mts_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      mts-network:
        ipv4_address: 172.30.0.5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mts-dotnet-backend
    restart: unless-stopped
    environment:
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB:-mts_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_RESET: ${ADMIN_PASSWORD_RESET:-false}
      DEMO_USER_ENABLED: ${DEMO_USER_ENABLED:-}
      DEMO_DATA_ENABLED: ${DEMO_DATA_ENABLED:-}
      OCR__Mode: ${OCR_MODE:-Remote}
      OCR__Endpoint: ${OCR_ENDPOINT:-http://ocr-service:8080/ocr}
      OCR__SampleText: ${OCR_SAMPLE_TEXT:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      Jwt__Issuer: ${JWT_ISSUER:-MaterialTraceabilitySystem}
      Jwt__Audience: ${JWT_AUDIENCE:-MtsClients}
      Smtp__Host: ${SMTP_HOST:-localhost}
      Smtp__Port: ${SMTP_PORT:-1025}
      RateLimiting__SafetyAssistant__PermitLimit: ${RateLimiting__SafetyAssistant__PermitLimit:-10}
      RateLimiting__SafetyAssistant__WindowSeconds: ${RateLimiting__SafetyAssistant__WindowSeconds:-60}
    depends_on:
      db:
        condition: service_healthy
      ocr-service:
        condition: service_healthy
    networks:
      mts-network:
        ipv4_address: 172.30.0.3
      ocr-network: {}

  ocr-service:
    # PaddlePaddle 2.6.2 inference crashes on the current linux/arm64 runtime;
    # use its stable x86_64 CPU wheel (Docker Desktop can emulate this on ARM).
    platform: linux/amd64
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    image: materialtraceabilitysystem-ocr
    container_name: mts-ocr-service
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 60s
    networks:
      - ocr-network

  frontend:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: mts-web-portal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      - backend
    networks:
      mts-network:
        ipv4_address: 172.30.0.4

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    container_name: mts-caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
    networks:
      mts-network:
        ipv4_address: 172.30.0.2

  mailpit:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    container_name: mts-mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - mts-network

volumes:
  mts_postgres_data:
    driver: local
  caddy_data:
  caddy_config:

networks:
  mts-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
  ocr-network:
    driver: bridge
    internal: true
